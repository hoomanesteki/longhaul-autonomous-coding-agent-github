# Fixes eval task calc-02: divide() uses floor division and drops the fraction.
steps:
  - respond:
      text: "Looking at the repo layout."
      tool_calls:
        - {name: list_dir, input: {path: "."}}
  - respond:
      tool_calls:
        - {name: read_file, input: {path: src/calc/__init__.py}}
  - respond:
      text: "divide() uses floor division. Replacing the line."
      tool_calls:
        - name: edit_file
          input:
            path: src/calc/__init__.py
            old_str: "    return a // b"
            new_str: "    return a / b"
  - respond:
      tool_calls:
        - {name: run_tests, input: {}}
  - match:
      turn_index: 4
      last_tool_result_contains: "4 passed"
    respond:
      tool_calls:
        - name: finish
          input: {summary: "Changed divide() to use true division. All tests pass."}
