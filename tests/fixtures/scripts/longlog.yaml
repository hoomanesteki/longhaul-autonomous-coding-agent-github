      text: "The diff is what I meant to write. Now the whole suite, to see that chunks is green and which module fails next. The summary line is all I need from it: the number of failures should drop by one, and the other modules should be as they were. If another module has started to fail because of this edit, the count will show it, and I will look at that module before I go on to the next one."
