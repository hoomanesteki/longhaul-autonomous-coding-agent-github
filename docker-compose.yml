name: longhaul

# Every published port is bound to 127.0.0.1. A bare host port means 0.0.0.0, which would
# put the database, Temporal (no auth) and MinIO on the local network.
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: longhaul
      POSTGRES_USER: longhaul
      # Read once, when the data volume is first created. See docs/runbook.md to change it.
      POSTGRES_PASSWORD: "${LH_POSTGRES_PASSWORD:-longhaul}"
    ports:
      - "127.0.0.1:${LH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longhaul -d longhaul"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.5.1
    user: "0:0" # the named volume is root-owned; dev server only
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:${LH_TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${LH_TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  minio:
    # MinIO's own images are no longer published; bitnamilegacy mirrors upstream builds.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_ROOT_USER: longhaul
      MINIO_ROOT_PASSWORD: longhaul-secret
    ports:
      - "127.0.0.1:${LH_MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r2
    depends_on:
      minio:
        condition: service_healthy
    # `up --wait` treats an exited container as failure even with code 0, so after creating
    # the bucket this init container idles and reports healthy once the bucket exists.
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 longhaul longhaul-secret &&
        mc mb --ignore-existing local/longhaul &&
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/longhaul >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${LH_JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${LH_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${LH_OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LH_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboards that docker/grafana/provisioning/dashboards/longhaul.yaml loads.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${LH_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The worker starts sandbox containers, so it needs the Docker socket and the checkpoint
  # folder. That is why it is in the profile `full` and a plain `make up` leaves it out:
  #   docker compose --profile full up -d --build worker
  # The socket gives the worker control of the host's Docker. Read "The worker in Docker" in
  # docs/runbook.md first. The checkpoint folder is mounted at the same path as on the host,
  # because the worker hands that path to the Docker daemon as the source of a sandbox mount.
  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    environment:
      LONGHAUL_DATABASE_URL: "postgresql://longhaul:${LH_POSTGRES_PASSWORD:-longhaul}@postgres:5432/longhaul"
      LONGHAUL_TEMPORAL_ADDRESS: temporal:7233
      LONGHAUL_BLOB_ENDPOINT: http://minio:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
      LONGHAUL_CKPT_DIR: "${LH_CKPT_DIR:-/var/lib/longhaul/ckpt}"
      # Inside the container the endpoint must listen on every interface, or the published port
      # below would reach nothing. The port is published on 127.0.0.1 only, as all the others.
      LONGHAUL_METRICS_HOST: 0.0.0.0
      LONGHAUL_PROVIDER: "${LONGHAUL_PROVIDER:-scripted}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
    ports:
      # The port that docker/prometheus/prometheus.yml scrapes as host.docker.internal:9464.
      - "127.0.0.1:9464:9464"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${LH_CKPT_DIR:-/var/lib/longhaul/ckpt}:${LH_CKPT_DIR:-/var/lib/longhaul/ckpt}"
    # Longer than the 30 s the worker waits for running activities, so docker stop does not
    # kill it in the middle of its graceful stop.
    stop_grace_period: 60s

volumes:
  pgdata:
  temporal-data:
  minio-data:
