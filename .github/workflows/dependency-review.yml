name: dependency-review

# Compares the dependencies of a pull request with those of its base, as GitHub's dependency
# graph reads them from the manifests, the lock files and the workflow actions. It fails when
# the pull request adds a package with a known vulnerability of high severity or worse. The
# pip-audit step of ci.yml checks the whole Python lock on every run; this checks what a change
# brings in, in every ecosystem, before it merges.
#
# The action needs the dependency graph of the repository, which is a setting (Settings, Code
# security, Dependency graph) that can be off and is off on this repository, and the action
# fails every pull request while the graph is off. So the job runs only when the repository variable DEPENDENCY_REVIEW is
# true, which the owner sets after turning the graph on. Until then the job is skipped, not
# failed. It lives in its own workflow because it has nothing to compare on a push, and the
# `ci` job of ci.yml counts a job that did not run as a failure.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
