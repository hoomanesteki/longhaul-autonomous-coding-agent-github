name: pages

# Publishes the docs site (site/) to GitHub Pages. ci.yml already builds the site on every
# pull request, so a broken page never reaches main. This workflow only runs after a merge.
#
# The owner sets Settings > Pages > Source to "GitHub Actions" once (docs/runbook.md). Until
# then the deploy job fails and the site stays offline.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only this workflow may write to Pages or mint an OIDC token, and only in the deploy job.
# Every other workflow keeps the read-only default.
permissions:
  contents: read

# Two deployments at once would race to publish. A running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # configure-pages asks the Pages API about the site, which needs this permission.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the docs site
        run: quarto render site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
