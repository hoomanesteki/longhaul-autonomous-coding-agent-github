[project]
name = "longhaul"
version = "0.1.0"
description = "Autonomous background coding agent for GitHub issues."
authors = [
    { name = "Hooman Esteki", email = "esteki.net@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3,<3",
    "asyncpg>=0.32.0",
    "docker>=7.2.0",
    "jsonschema>=4.26.0",
    "openai>=3.41.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
longhaul = "longhaul.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "temporalio>=1.34.0",
    "types-docker>=7.2.0.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["longhaul"]
warn_unused_configs = true
# Part of --strict, but mypy accepts it only as a global setting, never in an override.
warn_redundant_casts = true

# `strict = true` is a global switch even inside an override, so it would make every module
# strict. These are the flags it stands for, so only the four packages named in the plan
# are strict.
[[tool.mypy.overrides]]
module = [
    "longhaul.contracts",
    "longhaul.durable.*",
    "longhaul.context.*",
    "longhaul.cost.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["longhaul.db.migrations.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode gives each test file a name from its path, so tests/unit/test_x.py and
# tests/integration/test_x.py can both exist. The default mode names them by basename.
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: pure logic, no Docker, network or DB",
    "integration: needs the local docker compose stack",
    "e2e: full stack end-to-end",
    "chaos: kill-and-recover runs",
    "chaos_lite: short chaos runs for CI",
    "live: calls real model providers (paid)",
    "slow: long-running tests",
    "phase0: introduced in phase 0",
    "phase1: introduced in phase 1",
    "phase2: introduced in phase 2",
    "phase3: introduced in phase 3",
    "phase4: introduced in phase 4",
    "phase5: introduced in phase 5",
    "phase6: introduced in phase 6",
    "phase7: introduced in phase 7",
    "phase8: introduced in phase 8",
    "phase9: introduced in phase 9",
]
