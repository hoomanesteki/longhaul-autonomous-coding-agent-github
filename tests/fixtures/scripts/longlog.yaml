# Fixes tests/fixtures/repos/longlog: twelve modules, each with one planted bug and a
# test. The run takes 62 turns: a full run of the suite, then five turns for each module
# (read it, edit it, run its own test, look at the diff, run the whole suite), then finish.
#
# The suite prints 5,000 lines of trace, so the model reads a head, a tail and a handle,
# and the turns after it see a stub. The steps match only what survives that: the summary
# line that run_tests puts at the top of its result, the file that read_file returns, the
# diff that edit_file returns, and the first lines of a git diff. No step looks at the
# trace, or at a result that has been elided.
#
# Steps are keyed by turn_index as well. The index counts the turns that a compaction
# folded into notes, so a step matches the same turn before and after one.
#
# The compactor answers with notes that list the modules fixed so far. The step that edits
# a module says `Fixed <module>:`, and so do the notes. The highest module that the
# request mentions, in the turns to fold or in the previous notes, is the one the notes go
# up to. The steps run from the last module down, and the first that matches answers.
# Its steps are the ones in compactor.yaml, after the coder.
steps:
  # Turn 0: the first full run.
  - match:
      role: coder
      turn_index: 0
    respond:
      text: "I start by running the whole suite to see how many modules fail. The trace will be long, so I read the summary line first."
      tool_calls:
        - {name: run_tests, input: {}}
  # Module 1 of 12: chunks. Turns 1 to 5.
  - match:
      role: coder
      turn_index: 1
      last_tool_result_contains: "summary: 12 failed"
    respond:
      text: "The next failing test is test_chunk_keeps_the_last_partial_chunk. It splits five items into pieces of two and expects a last piece that holds the fifth. I open src/longlog/chunks.py to see how the function is written before I touch anything. The suite prints thousands of trace lines after its summary, so I read the summary line and leave the trace alone. If I ever need a detail from it, I can page through the output handle with read_output. Reading the module first costs one turn, and it saves me from editing a line that I have only guessed at. A module this short should show its problem at once."
      tool_calls:
        - {name: read_file, input: {path: "src/longlog/chunks.py"}}
  - match:
      role: coder
      turn_index: 2
      last_tool_result_contains: "return [items[i : i + size] for i in range(0, len(items) - size + 1, size)]"
    respond:
      text: "Fixed chunks: the range stopped early, so the last short chunk was dropped. I change that one line and keep the rest of the module as it is, so that the diff stays small and easy to review. I copy the line from the file I just read as old_str, because edit_file only accepts a piece of text that matches exactly once. I do not touch the test, because the test states what the function is meant to do, and the function is what is wrong. Nothing else in the package imports this module, so no other file can be affected."
      tool_calls:
        - name: edit_file
          input:
            path: src/longlog/chunks.py
            old_str: "    return [items[i : i + size] for i in range(0, len(items) - size + 1, size)]"
            new_str: "    return [items[i : i + size] for i in range(0, len(items), size)]"
  - match:
      role: coder
      turn_index: 3
      last_tool_result_contains: "+++ b/src/longlog/chunks.py"
    respond:
      text: "I run only tests/test_chunks.py first, so that a failure points at this one change and not at one of the other modules. The whole suite takes about as long, but its output is long, and I would rather read a short result before I spend a turn on the long one. If the test still fails, I read the failure before I change anything else, and I do not stack a second edit on top of one that I have not checked."
      tool_calls:
        - {name: run_tests, input: {target: "tests/test_chunks.py"}}
  - match:
      role: coder
      turn_index: 4
      last_tool_result_contains: "summary: 1 passed"
    respond:
      text: "The targeted test passes. Before the full run I look at the diff against base, to check that the edit touched one place and nothing else. The diff grows with every module I fix, so I only need its first lines to see that the earlier fixes are still in place. The diff is also the record that I hand over at the end, so I want it clean, with no stray change in it and no leftover from an attempt that did not work."
      tool_calls:
        - {name: git_diff, input: {}}
  - match:
