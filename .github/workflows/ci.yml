name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "feat/**", "fix/**", "spike/**", "chore/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LONGHAUL_PROVIDER: scripted

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: >
          uv run pytest tests/unit -q
          --cov=longhaul --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      LONGHAUL_DATABASE_URL: postgresql://longhaul:longhaul@localhost:5432/longhaul
      LONGHAUL_TEMPORAL_ADDRESS: localhost:7233
      LONGHAUL_BLOB_ENDPOINT: http://localhost:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: Ensure the blob bucket exists
        run: |
          uv run python - <<'PY'
          import os
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["LONGHAUL_BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["LONGHAUL_BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["LONGHAUL_BLOB_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["LONGHAUL_BLOB_BUCKET"]
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if bucket not in names:
                      s3.create_bucket(Bucket=bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: Build sandbox image
        run: make sandbox-image
      # Same selection as `make itest`. Live, slow and full chaos tests are opt-in.
      - name: Run integration tests
        run: >-
          uv run pytest -q
          -m "integration and not live and not slow and not (chaos and not chaos_lite)"
      - name: Show Temporal log on failure
        if: failure()
        run: docker logs temporal || true

  # The agent end to end, on a real sandbox and the scripted provider: no keys, no services.
  # The sandbox setup installs the fixture's dependencies from PyPI, so it needs the network.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Build sandbox image
        run: make sandbox-image
      # Same selection as `make e2e`. Live, slow and full chaos tests are opt-in.
      - name: Run end-to-end tests
        run: >-
          uv run pytest -q
          -m "e2e and not live and not slow and not (chaos and not chaos_lite)"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config -q

  # Builds the docs site (site/) so a broken include, diagram or page fails the pull request.
  # pages.yml publishes it from main with the same Quarto version.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the docs site
        run: quarto render site

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Audit locked dependencies
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-emit-project \
            > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps --timeout 60

  ci:
    if: always()
    needs: [lint, types, unit, integration, e2e, security, compose, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "at least one required job did not succeed" >&2
              exit 1
            fi
          done
