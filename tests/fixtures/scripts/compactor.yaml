# The compactor of the longlog run. longlog.yaml holds the same steps, because a run takes
# one script. A test keeps the two equal.
#
# The compactor answers with notes that list the modules fixed so far. The step that edits
# a module says `Fixed <module>:`, and so do the notes. The highest module that the
# request mentions, in the turns to fold or in the previous notes, is the one the notes go
# up to. The steps run from the last module down, and the first that matches answers.
steps:
  # 12 of 12 modules fixed.
  - match:
      role: compactor
      user_text_contains: "Fixed words:"
    respond:
      tool_calls:
        - name: record_progress_notes
          input:
            goal: &goal "Fix the planted bug in each of the 12 modules of src/longlog, one module at a time, until the whole suite passes."
            plan_status: []
            files_touched: [src/longlog/chunks.py, src/longlog/clamp.py, src/longlog/dedupe.py, src/longlog/initials.py, src/longlog/leap.py, src/longlog/ordinal.py, src/longlog/pages.py, src/longlog/percent.py, src/longlog/ranges.py, src/longlog/slug.py, src/longlog/stats.py, src/longlog/words.py]
            decisions:
              - "Fixed chunks: the range stopped early, so the last short chunk was dropped"
              - "Fixed clamp: the upper bound was one too low"
              - "Fixed dedupe: it kept the last copy of an item and not the first"
              - "Fixed initials: it read only the first word of the name"
              - "Fixed leap: years divisible by 400 were not counted as leap years"
              - "Fixed ordinal: 11, 12 and 13 got st, nd and rd instead of th"
              - "Fixed pages: the division rounded down, so the last page was missing"
              - "Fixed percent: the operands were the wrong way round"
              - "Fixed ranges: the stop value was left out of the range"
              - "Fixed slug: the words were not lower-cased"
              - "Fixed stats: the mean used integer division"
              - "Fixed words: splitting on one space counted every extra space as a word"
              - "Work in alphabetical order: run the full suite, read the failing module, edit one line, run its test, check git_diff, run the full suite again."
            failing_tests: []
            open_hypotheses: []
            tried_and_failed: &tried
              - "Reading the trace of a test run. It has 5,000 lines: use the summary line, and read_output with a pattern when a detail is needed."
            covers_turns_up_to: 0
