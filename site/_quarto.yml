project:
  type: website
  output-dir: _site
  # Listed on purpose. Without a list Quarto finds no pages when the checkout sits under a dot
  # folder such as .worktrees, and it renders nothing without saying so.
  render:
    - "*.qmd"
    - "adr/*.qmd"
  # Writes the pages that are derived from docs/ (ADR pages, indexes, diagram sources).
  # python3 is whatever is on the PATH, so the script uses only the standard library.
  pre-render: python3 ../scripts/site_pages.py

# Used by the "rendered from" links as {{< meta source-repo >}}.
source-repo: https://github.com/hoomanesteki/longhaul-autonomous-coding-agent-github

# fragments.lua runs first, so docs.lua also sees the files it embeds.
filters:
  - filters/fragments.lua
  - filters/docs.lua

website:
  title: Longhaul
  description: A durable background coding agent for GitHub issues. How it works, the proof, and how to run it.
  site-url: https://hoomanesteki.github.io/longhaul-autonomous-coding-agent-github/
  favicon: favicon.svg
  navbar:
    search: true
    # Grouped by what a reader is after. tests/unit/test_docs_site.py holds the same list.
    left:
      - text: Overview
        href: index.qmd
      - text: How it works
        menu:
          - text: Architecture
            href: architecture.qmd
          - text: Decisions
            href: decisions.qmd
          - text: Console
            href: console.qmd
      - text: Proof
        menu:
          - text: Results
            href: results.qmd
          - text: Gate reports
            href: gates.qmd
          - text: Case study
            href: case-study.qmd
      - text: Operate
        menu:
          - text: Runbook
            href: runbook.qmd
          - text: Security
            href: security.qmd
          - text: Deploy to AWS
            href: deploy-aws.qmd
      - text: Project
        menu:
          - text: Plan
            href: plan.qmd
          - text: Progress
            href: progress.qmd
          - text: Demo script
            href: demo.qmd
    tools:
      - icon: github
        href: https://github.com/hoomanesteki/longhaul-autonomous-coding-agent-github
        text: Longhaul on GitHub
  page-footer:
    center: >-
      Longhaul is open source under the MIT license.
      [Source on GitHub](https://github.com/hoomanesteki/longhaul-autonomous-coding-agent-github).

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    respect-user-color-scheme: true
    # The tab title is set in filters/docs.lua, so Quarto must not add its own site name.
    title-prefix: ""
    toc: true
    toc-depth: 3
    toc-title: On this page
    smooth-scroll: true
    code-copy: true
    lang: en
