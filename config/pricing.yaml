# US dollars per million tokens. Copied from the provider's model table as cached on
# 2026-10-06. Check these against the live pricing page before LH-701 builds the cost
# ledger on them, and change them here, never in code.
models:
  claude-sonnet-5-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
    cache_write_per_mtok: 2.50
    cache_read_per_mtok: 0.20
  claude-haiku-5-5:
