<script>
// Quarto marks the current page in the navbar only when its link sits on the bar itself, so the
// pages inside the menus showed no current page at all. This marks the menu item of the page
// and the toggle of its menu. An ADR page has no item of its own: it belongs to Decisions.
(function () {
  function key(path) {
    return path.replace(/\.html$/, "").replace(/\/$/, "/index");
  }
  var here = window.location.pathname;
  var adr = here.lastIndexOf("/adr/");
  if (adr !== -1) {
    here = here.slice(0, adr) + "/decisions.html";
  }
  var current = key(here);
  document.querySelectorAll("#quarto-header .dropdown-item").forEach(function (item) {
    if (!item.href || key(new URL(item.href).pathname) !== current) {
      return;
    }
    item.classList.add("active");
    item.setAttribute("aria-current", "page");
    var menu = item.closest(".dropdown");
    var toggle = menu && menu.querySelector(".dropdown-toggle");
    if (toggle) {
      toggle.classList.add("active");
    }
  });
})();
</script>
