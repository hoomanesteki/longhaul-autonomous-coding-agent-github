# Fixes tests/fixtures/repos/calc: add() subtracts instead of adding.
# Steps have no match, so they run by turn index (0..4).
steps:
  - respond:
      text: "Looking at the repo layout."
      tool_calls:
        - {name: list_dir, input: {path: "."}}
  - respond:
      tool_calls:
        - {name: read_file, input: {path: src/calc/__init__.py}}
  - respond:
      text: "add() subtracts. Replacing the line."
      tool_calls:
        - name: edit_file
          input:
            path: src/calc/__init__.py
            old_str: "    return a - b"
            new_str: "    return a + b"
  - respond:
      tool_calls:
        - {name: run_tests, input: {}}
  - respond:
      tool_calls:
        - name: finish
          input: {summary: "Changed add() to return a + b. All tests pass."}
