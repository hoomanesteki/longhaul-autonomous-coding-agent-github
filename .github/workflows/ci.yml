name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "feat/**", "fix/**", "spike/**", "chore/**"]
  workflow_dispatch:
  # Once a day on the default branch, for the chaos-lite job. The jobs above run as well.
  schedule:
    - cron: "17 3 * * *"

# A newer push to a pull request cancels the older run of that pull request. Every other run has
# a group of its own (its run id), so a run on dev or main is never cancelled, and a pending one
# is never replaced by the next push, which a shared group with cancel-in-progress false does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LONGHAUL_PROVIDER: scripted

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actionlint checks every workflow file, and runs shellcheck (on the runner image) on their
    # run steps. The binary is pinned by version and checksum, as gitleaks is in `security`.
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$tarball"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint the workflows
        run: actionlint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy src eval

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: >
          uv run pytest tests/unit -q
          --cov=longhaul --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80
      # The report is for reading only, so an outage of the artifact store must not fail the job.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      LONGHAUL_DATABASE_URL: postgresql://longhaul:longhaul@localhost:5432/longhaul
      LONGHAUL_TEMPORAL_ADDRESS: localhost:7233
      LONGHAUL_BLOB_ENDPOINT: http://localhost:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: Ensure the blob bucket exists
        run: |
          uv run python - <<'PY'
          import os
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["LONGHAUL_BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["LONGHAUL_BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["LONGHAUL_BLOB_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["LONGHAUL_BLOB_BUCKET"]
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if bucket not in names:
                      s3.create_bucket(Bucket=bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: Build sandbox image
        run: make sandbox-image
      # Same selection as `make itest`. Live, slow and full chaos tests are opt-in.
      - name: Run integration tests
        run: >-
          uv run pytest -q
          -m "integration and not live and not slow and not (chaos and not chaos_lite)"
      - name: Show Temporal log on failure
        if: failure()
        run: docker logs temporal || true

  # The agent end to end with the scripted provider: no keys. The durable run needs the same
  # services as the integration job, and the sandbox setup installs the fixture's
  # dependencies from PyPI, so it needs the network.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      LONGHAUL_DATABASE_URL: postgresql://longhaul:longhaul@localhost:5432/longhaul
      LONGHAUL_TEMPORAL_ADDRESS: localhost:7233
      LONGHAUL_BLOB_ENDPOINT: http://localhost:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: Ensure the blob bucket exists
        run: |
          uv run python - <<'PY'
          import os
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["LONGHAUL_BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["LONGHAUL_BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["LONGHAUL_BLOB_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["LONGHAUL_BLOB_BUCKET"]
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if bucket not in names:
                      s3.create_bucket(Bucket=bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: Build sandbox image
        run: make sandbox-image
      # Same selection as `make e2e`. Live, slow and full chaos tests are opt-in.
      - name: Run end-to-end tests
        run: >-
          uv run pytest -q
          -m "e2e and not live and not slow and not (chaos and not chaos_lite)"
      - name: Show Temporal log on failure
        if: failure()
        run: docker logs temporal || true

  # The short chaos run (tests/chaos): five runs of the scripted inventory fix, each with the
  # worker killed once, and a check that every run ends with the diff of an unkilled one. It
  # needs the services of the integration job and the network for the sandbox setup, and it takes
  # many minutes, so it runs on the nightly schedule and by hand and not on pushes. The `ci` job
  # does not wait for it: a job that did not run is "skipped", which `ci` would count as a
  # failure (tests/unit/test_ci_config.py keeps the two apart).
  chaos-lite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      LONGHAUL_DATABASE_URL: postgresql://longhaul:longhaul@localhost:5432/longhaul
      LONGHAUL_TEMPORAL_ADDRESS: localhost:7233
      LONGHAUL_BLOB_ENDPOINT: http://localhost:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: Ensure the blob bucket exists
        run: |
          uv run python - <<'PY'
          import os
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["LONGHAUL_BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["LONGHAUL_BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["LONGHAUL_BLOB_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["LONGHAUL_BLOB_BUCKET"]
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if bucket not in names:
                      s3.create_bucket(Bucket=bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: Build sandbox image
        run: make sandbox-image
      # The full chaos suite (20 runs) is opt-in and runs on the owner's machine in Phase 9.
      - name: Run the short chaos tests
        run: uv run pytest -q -m "chaos_lite"
      - name: Show Temporal log on failure
        if: failure()
        run: docker logs temporal || true

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config -q

  # Builds the docs site (site/) so a broken include, diagram or page fails the pull request.
  # pages.yml publishes it from main with the same Quarto version.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The setup downloads Quarto from GitHub; one failed download should not fail the run.
      - id: quarto
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          version: 1.10.18
      - if: steps.quarto.outcome == 'failure'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the docs site
        run: quarto render site

  # The console (console/): lint, typecheck, test and build. The API types are generated from
  # console/openapi.json, so the job generates them again and fails when the committed file
  # differs, before the typecheck reads it. A test in the unit job keeps openapi.json itself in
  # step with the Python app.
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run api:types
      - run: git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The browser test of the console (LH-808): Playwright drives the built console against a real
  # worker with the scripted model, Docker sandboxes, Temporal, Postgres and MinIO. The web server
  # of the test is scripts/seed_demo.sh, which seeds three tasks and two lesson candidates in a
  # scratch database, so the job needs the services of the e2e job and the network for the
  # sandbox setup. It runs on every push and pull request and not only on dev: the `ci` job waits
  # for it, and a job that did not run counts as a failure there (tests/unit/test_ci_config.py).
  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      LONGHAUL_DATABASE_URL: postgresql://longhaul:longhaul@localhost:5432/longhaul
      LONGHAUL_TEMPORAL_ADDRESS: localhost:7233
      LONGHAUL_BLOB_ENDPOINT: http://localhost:9000
      LONGHAUL_BLOB_BUCKET: longhaul
      LONGHAUL_BLOB_ACCESS_KEY: longhaul
      LONGHAUL_BLOB_SECRET_KEY: longhaul-secret
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        working-directory: .
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: Ensure the blob bucket exists
        working-directory: .
        run: |
          uv run python - <<'PY'
          import os
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["LONGHAUL_BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["LONGHAUL_BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["LONGHAUL_BLOB_SECRET_KEY"],
              region_name="us-east-1",
          )
          bucket = os.environ["LONGHAUL_BLOB_BUCKET"]
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if bucket not in names:
                      s3.create_bucket(Bucket=bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: Build sandbox image
        working-directory: .
        run: make sandbox-image
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      # The API serves the built files (LONGHAUL_CONSOLE_DIR), so the build comes before the test.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run the browser test
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
      - name: Show Temporal log on failure
        if: failure()
        working-directory: .
        run: docker logs temporal || true

  # Checks the Terraform in deploy/terraform/aws without an AWS account: the format, then
  # `init -backend=false` (the providers, no state) and `validate`. Nothing here makes a plan or
  # applies anything, because CI holds no cloud credentials. Applying is manual and is followed
  # by a teardown (docs/deploy-aws.md). The Terraform version is the one in versions.tf.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          # The wrapper replaces the terraform binary with a script that captures its output.
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL --retry 5 --retry-all-errors "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: gitleaks git --log-opts="--all" --redact --verbose .
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --format requirements-txt --no-hashes --no-emit-project \
            > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps --timeout 60

  # Builds the images that `docker compose --profile full` runs, without pushing them, and starts
  # each once: the worker image runs the CLI, and the API image refuses to start without a token
  # and answers /healthz with a database. A Dockerfile that no longer builds, or an image that
  # cannot start its command, then fails the pull request instead of the first deploy.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the worker image
        run: docker build -f docker/worker/Dockerfile -t longhaul-worker:ci .
      - name: Build the API image
        run: docker build -f docker/api/Dockerfile -t longhaul-api:ci .
      - name: The worker image runs the CLI
        run: docker run --rm longhaul-worker:ci longhaul --help
      - name: The API image stops at its start without a token
        run: |
          if docker run --rm longhaul-api:ci > api.log 2>&1; then
            echo "the API started without LONGHAUL_ADMIN_TOKEN" >&2
            exit 1
          fi
          grep -F "LONGHAUL_ADMIN_TOKEN is not set" api.log
      # /healthz asks the database only, so the blob store and Temporal may be absent here.
      - name: The API image answers /healthz
        run: |
          # A fresh token each run, so no fixed value sits in the file.
          LONGHAUL_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export LONGHAUL_ADMIN_TOKEN
          docker run -d --name api --network host \
            -e LONGHAUL_ADMIN_TOKEN \
            -e LONGHAUL_DATABASE_URL=postgresql://longhaul:longhaul@localhost:5432/longhaul \
            -e LONGHAUL_BLOB_ENDPOINT=http://localhost:9000 \
            -e LONGHAUL_BLOB_BUCKET=longhaul \
            -e LONGHAUL_BLOB_ACCESS_KEY=longhaul \
            -e LONGHAUL_BLOB_SECRET_KEY=longhaul-secret \
            longhaul-api:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "the API did not answer /healthz within 60s" >&2
          docker logs api >&2
          exit 1

  # The README quickstart on a clean runner: `make setup`, then `make demo`, with the services
  # that `make up` would start provided the way the e2e job provides them. The job sets no
  # LONGHAUL_* variable, so the demo reads the .env that `make setup` copies from .env.example,
  # as it does on a laptop. The demo stops its worker and removes its sandbox, and the last step
  # checks that nothing of it is left.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: longhaul
          POSTGRES_USER: longhaul
          POSTGRES_PASSWORD: longhaul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longhaul -d longhaul"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
          MINIO_ROOT_USER: longhaul
          MINIO_ROOT_PASSWORD: longhaul-secret
          MINIO_DEFAULT_BUCKETS: longhaul
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # The image docker-compose.yml uses (ADR-0002), pinned by digest. A tag can be moved to
      # other content and a digest cannot, so CI and `make up` run the same server.
      - name: Start Temporal dev server
        env:
          TEMPORAL_IMAGE: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
        run: |
          docker run -d --name temporal -p 7233:7233 "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 1 60); do
            if docker exec temporal temporal operator cluster health \
              --address localhost:7233 > /dev/null 2>&1; then
              echo "temporal is up"
              exit 0
            fi
            sleep 1
          done
          echo "temporal did not start within 60s" >&2
          docker logs temporal >&2
          exit 1
      - name: make setup
        run: make setup
      # minio-init makes the bucket under `make up`. Here the service makes it, and this step
      # waits until it is there, with the settings of the .env that `make setup` wrote.
      - name: Wait for the blob bucket
        run: |
          uv run python - <<'PY'
          import time

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          from longhaul.settings import EnvSettings

          settings = EnvSettings()
          assert settings.blob_access_key and settings.blob_secret_key
          s3 = boto3.client(
              "s3",
              endpoint_url=settings.blob_endpoint,
              aws_access_key_id=settings.blob_access_key.get_secret_value(),
              aws_secret_access_key=settings.blob_secret_key.get_secret_value(),
              region_name="us-east-1",
          )
          for _ in range(30):
              try:
                  names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
                  if settings.blob_bucket not in names:
                      s3.create_bucket(Bucket=settings.blob_bucket)
                  print("bucket ready")
                  break
              except (BotoCoreError, ClientError) as exc:
                  print("waiting for minio:", exc)
                  time.sleep(2)
          else:
              raise SystemExit("minio bucket was not ready in time")
          PY
      - name: make demo
        timeout-minutes: 15
        run: make demo
      - name: Nothing of the demo is left running
        run: |
          left="$(docker ps -aq --filter label=longhaul.task_id)"
          if [ -n "$left" ]; then
            docker ps -a --filter label=longhaul.task_id >&2
            exit 1
          fi
          if pgrep -af "longhaul worker"; then
            echo "a worker of the demo is still running" >&2
            exit 1
          fi
      - name: Show Temporal log on failure
        if: failure()
        run: docker logs temporal || true

  ci:
    if: always()
    needs: [lint, types, unit, integration, e2e, security, compose, docs, console, console-e2e, terraform, images, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "at least one required job did not succeed" >&2
              exit 1
            fi
          done
