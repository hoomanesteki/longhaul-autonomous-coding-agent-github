# US dollars per million tokens. Checked on 2026-11-03 against the provider's published model
# table. A cache write costs 1.25 times the input price and a cache read 0.1 times (the default
# 5 minute cache, which is the only one Longhaul uses). When the provider changes a price, or
# the config names a new model, change the numbers here and the date above, never in code.
models:
  claude-sonnet-5-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
    cache_write_per_mtok: 2.50
    cache_read_per_mtok: 0.20
  claude-haiku-5-5:
    # These rates are for a call whose prompt is up to 100,000 tokens, the input, cache read
    # and cache write tokens of that call added together. A longer prompt bills the whole call,
    # output included, at the long_prompt rates instead.
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    cache_write_per_mtok: 0.125
    cache_read_per_mtok: 0.01
    long_prompt:
      above_tokens: 100000
      input_per_mtok: 0.50
      output_per_mtok: 2.50
      cache_write_per_mtok: 0.625
      cache_read_per_mtok: 0.05
