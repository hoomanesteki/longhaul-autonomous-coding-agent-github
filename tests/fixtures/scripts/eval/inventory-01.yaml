# Fixes eval task inventory-01: remove() allows negative stock.
# Thirteen turns over four files: a new errors module, the store, the package exports and a new
# test file. It is the longest script of the chaos suite, so that a run has many activities for
# a kill to land in (eval/chaos/README.md). The first twelve steps run by turn index, and the
# last one also waits for a passing run of the whole suite ("14 passed": the eleven tests of the
# repo and the three this script adds).
steps:
  - respond:
      text: "Looking at the repo layout."
      tool_calls:
        - {name: list_dir, input: {path: "."}}
  - respond:
      tool_calls:
        - {name: read_file, input: {path: src/inventory/store.py}}
  - respond:
      tool_calls:
        - {name: read_file, input: {path: src/inventory/__init__.py}}
  - respond:
      tool_calls:
        - {name: read_file, input: {path: tests/test_store.py}}
  - respond:
      text: "remove() needs its own error type. Creating it first."
      tool_calls:
        - name: write_file
          input:
            path: src/inventory/errors.py
            content: |
              class InventoryError(ValueError):
                  """Raised when an inventory operation would break a stock rule."""
  - respond:
      tool_calls:
        - name: edit_file
          input:
            path: src/inventory/store.py
            old_str: |-
              class Inventory:
                  """Tracks the on-hand quantity of each SKU."""
            new_str: |-
              from inventory.errors import InventoryError


              class Inventory:
                  """Tracks the on-hand quantity of each SKU."""
  - respond:
      text: "Now the check in remove()."
      tool_calls:
        - name: edit_file
          input:
            path: src/inventory/store.py
            old_str: "        self._stock[sku] = self.quantity(sku) - quantity"
            # |2- keeps the eight spaces in front of the first line.
            new_str: |2-
                      current = self.quantity(sku)
                      if quantity > current:
                          raise InventoryError(f"{sku}: cannot remove {quantity}, only {current} in stock")
                      self._stock[sku] = current - quantity
  - respond:
      tool_calls:
        - name: edit_file
          input:
            path: src/inventory/__init__.py
            old_str: "from inventory.export import dump_json, dump_yaml"
            new_str: |-
              from inventory.errors import InventoryError
              from inventory.export import dump_json, dump_yaml
  - respond:
      tool_calls:
        - name: edit_file
          input:
            path: src/inventory/__init__.py
            old_str: '__all__ = ["Inventory", "Reservations", "dump_json", "dump_yaml"]'
            new_str: '__all__ = ["Inventory", "InventoryError", "Reservations", "dump_json", "dump_yaml"]'
  - respond:
      text: "Tests for the new rule."
      tool_calls:
        - name: write_file
          input:
            path: tests/test_store_limits.py
            content: |
              import pytest
              from inventory import Inventory, InventoryError


              def test_removing_more_than_is_in_stock_is_rejected() -> None:
                  inv = Inventory()
                  inv.add("widget", 2)
                  with pytest.raises(InventoryError, match="widget"):
                      inv.remove("widget", 5)
                  assert inv.quantity("widget") == 2


              def test_removing_an_unknown_sku_is_rejected() -> None:
                  with pytest.raises(InventoryError):
                      Inventory().remove("gadget", 1)


              def test_removing_exactly_what_is_in_stock_is_allowed() -> None:
                  inv = Inventory()
                  inv.add("widget", 2)
                  inv.remove("widget", 2)
                  assert inv.quantity("widget") == 0
  - respond:
      tool_calls:
        - {name: git_diff, input: {}}
  - respond:
      tool_calls:
        - {name: run_tests, input: {}}
  - match:
      turn_index: 12
      last_tool_result_contains: "14 passed"
    respond:
      tool_calls:
        - name: finish
          input: {summary: "remove() now raises InventoryError when it would go below zero. All tests pass."}
