[alembic]
script_location = src/longhaul/db/migrations
prepend_sys_path = src
path_separator = os
# The database URL is not set here. env.py takes it from the Config in code (attributes, then
# the sqlalchemy.url option), then from LONGHAUL_DATABASE_URL or .env. It has no default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
