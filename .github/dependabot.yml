version: 2
# Version bumps go to dev like any other change. main moves only through phase-gate pull
# requests, so a bump merged there would skip dev's CI and the gate.
#
# Each ecosystem groups its updates into one pull request a week, so one branch instead of one
# per package. Major Python bumps stay out of the group: they can need code changes and an
# ADR-0002 update, so each gets its own pull request.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  # The console's packages. The lock file is console/package-lock.json, which the console job of
  # ci.yml installs from with `npm ci`.
  - package-ecosystem: npm
    directory: /console
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      console:
        patterns: ["*"]
        update-types: [minor, patch]
    # No TypeScript major after 5 installs yet: typescript-eslint 8.72 accepts typescript below
    # 6.1 and openapi-typescript 7.13 asks for typescript 5, so `npm ci` stops on a peer
    # conflict (the 7.0.2 bump did). Drop this rule once both accept the new major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # The AWS provider and the Terraform lock file. A bump also needs its row in ADR-0002, which
  # tests/unit/test_deploy_aws.py checks. Terraform itself is pinned in versions.tf and in the
  # terraform job of ci.yml, which dependabot does not read, so a new release is a manual
  # change to both and to the ADR.
  - package-ecosystem: terraform
    directory: /deploy/terraform/aws
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
