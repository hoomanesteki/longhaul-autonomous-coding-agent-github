name: pages

# Publishes the docs site (site/) to GitHub Pages. ci.yml already builds the site on every
# pull request, so a broken page never reaches main. This workflow only runs after a merge.
#
# Settings > Pages > Source is "GitHub Actions" (docs/runbook.md), so each push to main publishes
# the site. The repository variable PAGES_ENABLED set to false turns the deploy off.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only this workflow may write to Pages or mint an OIDC token, and only in the deploy job.
# tests/unit/test_workflow_hardening.py lists every job of every workflow that may write.
permissions:
  contents: read

# Two deployments at once would race to publish. A running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # configure-pages asks the Pages API about the site, which needs this permission.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The setup downloads Quarto from GitHub; one failed download should not fail the run.
      - id: quarto
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          version: 1.10.18
      - if: steps.quarto.outcome == 'failure'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the docs site
        run: quarto render site
      # Fails on a link, anchor or image that does not resolve under the Pages address, before
      # anything is uploaded. Like the render, it runs whether or not the deploy is on.
      - name: Check the links of the docs site
        run: make site-check
      # The Pages steps run unless the repository variable PAGES_ENABLED is false. With the
      # deploy turned off the site still renders, so a broken page still fails the run.
      - uses: actions/configure-pages@v6
        if: vars.PAGES_ENABLED != 'false'
      - uses: actions/upload-pages-artifact@v5
        if: vars.PAGES_ENABLED != 'false'
        with:
          path: site/_site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
