# The model of the console demo (LH-808): one worker, three tasks, one script.
#
# scripts/seed_demo.sh starts a worker with this script and three issues on the calc fixture. The
# worker plays one script for every task, so the steps have to tell the tasks apart:
#
#   shipped  plans, fixes add() and opens a pull request (calc_fix_planned.yaml, step for step).
#   plan     the same answers. Its repo asks for a decision on the plan, so the task waits after
#            the plan until someone approves it in the console, and then goes on as `shipped`.
#   stuck    the repo has the file SCENARIO_STUCK.md (STUCK_MARKER in scripts/demo_stack.py). The
#            coder lists the repo, then runs the failing suite three times, which is the
#            REPEATED_FAILURE rule of the stuck detector, and the task pauses. After a hint it fixes
#            the bug. The model call that follows the hint waits twenty seconds, so the phase
#            stays at coding for longer than the console takes to poll, and a browser test can
#            see it.
#
# A script sees the messages of a request and not its system prompt, where the issue text is, so
# the tasks are told apart by the listing of the repo root that the first coder turn reads. The
# planner is the same for all three. The steps for `stuck` come before the default steps of the
# coder, and the first step that matches wins. The default steps start with the listing, so the
# stuck steps start at turn 1.
steps:
  - match: {role: planner, turn_index: 0}
    respond:
      text: "Looking at the repo layout."
      tool_calls:
        - {name: list_dir, input: {path: "."}}
  - match: {role: planner, turn_index: 1}
    respond:
      tool_calls:
        - {name: read_file, input: {path: src/calc/__init__.py}}
  - match: {role: planner, turn_index: 2}
    respond:
      tool_calls:
        - name: submit_plan
          input:
            summary: "add() subtracts. Change the operator and run the suite."
            steps:
              - id: s1
                description: "Change the operator in add() from - to +"
                files: [src/calc/__init__.py]
                done_when: "add(2, 3) returns 5"
              - id: s2
                description: "Run the whole test suite"
                files: []
                done_when: "every test in tests/test_calc.py passes"
            acceptance_checks: ["python -m pytest -q"]
            risks: ["A caller may rely on the old result."]

  # stuck: the listing (the default turn 0), three runs of the failing suite, a pause, a hint,
  # then the fix.
  - match: {role: coder, turn_index: 1, request_contains: "SCENARIO_STUCK.md"}
    respond:
      text: "Running the suite to see the failure."
      tool_calls:
        - {name: run_tests, input: {}}
  - match: {role: coder, turn_index: 2, request_contains: "SCENARIO_STUCK.md"}
    respond:
      text: "Running the suite again."
      tool_calls:
        - {name: run_tests, input: {}}
  - match: {role: coder, turn_index: 3, request_contains: "SCENARIO_STUCK.md"}
    respond:
      text: "Running the suite once more."
      tool_calls:
        - {name: run_tests, input: {}}
  - match:
      role: coder
      turn_index: 4
      user_text_contains: "Hint from"
      request_contains: "SCENARIO_STUCK.md"
    respond:
      delay_s: 20
      text: "Thanks. Replacing the operator."
      tool_calls:
        - name: edit_file
          input:
            path: src/calc/__init__.py
            old_str: "    return a - b"
            new_str: "    return a + b"
  - match: {role: coder, turn_index: 5, request_contains: "SCENARIO_STUCK.md"}
    respond:
      tool_calls:
        - {name: run_tests, input: {}}
  - match:
      role: coder
      turn_index: 6
      last_tool_result_contains: "3 passed"
      request_contains: "SCENARIO_STUCK.md"
    respond:
      tool_calls:
        - name: update_step
          input: {step_id: s1, status: done, note: "add() returns a + b."}
        - name: update_step
          input: {step_id: s2, status: done, note: "3 passed."}
        - name: submit_for_review
          input: {summary: "Changed add() to return a + b after a hint. All tests pass."}
  # The question the task asks when it pauses. Only the stuck task ever reaches the compactor.
  - match:
      role: compactor
      user_text_contains: "Why the agent is stuck"
    respond:
      tool_calls:
        - name: record_stuck_summary
          input:
            goal: "Make add() in src/calc/__init__.py return the sum of its arguments."
            tried:
              - "Ran the test suite three times."
              - "Read src/calc/__init__.py while planning."
            guess: "The operator in add() is wrong, but I have not changed it yet."
            question: "Is it fine to change the operator in add() from - to +?"

  # shipped and plan: read, edit, test, submit.
  - match: {role: coder, turn_index: 0}
    respond:
      text: "Looking at the repo layout."
      tool_calls:
        - {name: list_dir, input: {path: "."}}
  - match: {role: coder, turn_index: 1}
    respond:
      tool_calls:
        - {name: read_file, input: {path: src/calc/__init__.py}}
  - match: {role: coder, turn_index: 2}
    respond:
      text: "add() subtracts. Replacing the line."
      tool_calls:
        - name: edit_file
          input:
            path: src/calc/__init__.py
            old_str: "    return a - b"
            new_str: "    return a + b"
  - match: {role: coder, turn_index: 3}
    respond:
      tool_calls:
        - {name: run_tests, input: {}}
  - match:
      role: coder
      turn_index: 4
      last_tool_result_contains: "3 passed"
    respond:
      tool_calls:
        - name: update_step
          input: {step_id: s1, status: done, note: "add() returns a + b."}
        - name: update_step
          input: {step_id: s2, status: done, note: "3 passed."}
        - name: submit_for_review
          input: {summary: "Changed add() to return a + b. All tests pass."}
